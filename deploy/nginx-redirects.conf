# karaktea.com — host-level redirect + error-page config
#
# Implements: DEPLOYMENT.md → "301 redirect map (Bold promotion + Arabic-first
# cutover, 2026-07-12)", plus host canonicalisation and the custom 404 page.
# Kept in the repo (not only as prose in DEPLOYMENT.md) so the next server
# migration copies it instead of re-typing it — that is how it got lost the
# first time. Verified missing on the live host 2026-08-07.
#
# ###########################################################################
# CORRECTION TO DEPLOYMENT.md — READ BEFORE APPLYING
#
# The redirect table in DEPLOYMENT.md contains the row:
#     | `/` (was EN home) | `/en/` |
# DO NOT IMPLEMENT THAT ROW. It contradicts the Arabic-first cutover in the
# same document. The live root already serves the Arabic homepage at 200
# (<title>الرئيسية - شاي كرك</title>, verified 2026-08-07). Redirecting `/`
# to `/en/` would make English the default for anyone typing the bare domain
# and would undo the cutover. Only the more specific old-English paths below
# get redirected. (foodhacks.co's DEPLOYMENT.md lists the same row but has a
# "Caution" note underneath saying not to do it; karaktea's is missing that
# note — hence this warning.)
# ###########################################################################

# ---------------------------------------------------------------------------
# PART A — host canonicalisation (separate server block, NOT inside the main
#          one). See sanramonkw.com/deploy/nginx-redirects.conf Part A for the
#          full explanation and the behind-a-proxy variant.
# ---------------------------------------------------------------------------
#
# Verified 2026-08-07:
#   http://karaktea.com/        301 → https://karaktea.com/   ✅ already correct
#   https://www.karaktea.com/   200                            ❌ needs redirect
#
# server {
#     listen 80;
#     listen 443 ssl;
#     server_name www.karaktea.com;
#     # ssl_certificate / ssl_certificate_key — same paths as the main block
#     return 301 https://karaktea.com$request_uri;
# }

# ---------------------------------------------------------------------------
# PART B — inside the main server{} block for karaktea.com
# ---------------------------------------------------------------------------

# Keep the scheme on nginx's own trailing-slash redirects.
absolute_redirect off;

# Serve the site's own 404 page instead of nginx's 153-byte default.
# Status stays 404; `internal` keeps /404.html itself out of the index.
error_page 404 /404.html;
location = /404.html {
    internal;
}

# --- Old English-at-root URLs → /en/... ------------------------------------
# NB: no rule for "/" — see the correction notice at the top of this file.
location = /products/        { return 301 /en/products/; }
location = /preparation/     { return 301 /en/preparation/; }
location = /vending-machine/ { return 301 /en/vending-machine/; }
location = /faqs/            { return 301 /en/faqs/; }
location = /contact-us/      { return 301 /en/contact-us/; }

# Same without trailing slashes.
location = /products        { return 301 /en/products/; }
location = /preparation     { return 301 /en/preparation/; }
location = /vending-machine { return 301 /en/vending-machine/; }
location = /faqs            { return 301 /en/faqs/; }
location = /contact-us      { return 301 /en/contact-us/; }

# --- Old /ar/... URLs → root Arabic URLs (drop the /ar/ prefix) ------------
# Covers all five Arabic inner pages (/المنتجات/, /التحضير/,
# /آلات-التوزيع/, /أسئلة-مكررة/, /اتصل-بنا/) with one rule.
# DEPLOYMENT.md flags encoded-Arabic handling as this site's most common
# static-host breakage — smoke-test all five AR pages after deploying.
location = /ar  { return 301 /; }
location = /ar/ { return 301 /; }
location ^~ /ar/ {
    rewrite ^/ar/(.*)$ /$1 permanent;
}

# --- Legacy WordPress fragment URLs ----------------------------------------
# Pointed at their FINAL targets in one hop. DEPLOYMENT.md warns explicitly:
# do not rely on these chaining through "/" → "/en/" — that second hop does
# not exist (and must not, per the correction notice above).
location ^~ /site-faqs/    { return 301 /en/faqs/; }
location ^~ /site-products/ { return 301 /en/products/; }
location ^~ /site-contact/  { return 301 /en/contact-us/; }
location ^~ /site-footer/   { return 301 /en/; }
location ^~ /home/          { return 301 /en/; }
location ^~ /slides/        { return 301 /en/; }

# WordPress feed URLs.
location ^~ /feed/ { return 301 /en/; }

# Old WordPress ?p=<id> shortlinks (root only — see the sanramonkw.com file
# for why this is not written as `location = /`).
if ($request_uri ~ "^/\?p=") {
    return 301 /en/;
}
